global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'rag-assistant'
    environment: 'development'

scrape_configs:
  - job_name: 'rag-assistant'
    static_configs:
      - targets: ['rag-assistant:8000']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'chromadb'
    static_configs:
      - targets: ['chromadb:8000']
    metrics_path: '/api/v1/metrics'

  - job_name: 'ollama'
    static_configs:
      - targets: ['ollama:11434']
    metrics_path: '/metrics'
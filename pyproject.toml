[project]
name = "rag-assistant"
version = "0.1.0"
description = "Production-ready RAG Document Q&A Assistant with FastAPI, Chroma, and the Groq API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    "slowapi>=0.1.9",
    "chromadb>=0.5.5",
    "sentence-transformers>=3.0.0",
    "jinja2>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.13.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
eval = [
    "ragas>=0.2.0",
    "deepeval>=1.0.0",
    "datasets>=2.19.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "T20", "SIM", "PIE", "PT", "PL", "TRY", "TD", "FA", "PD", "PG", "PYI", "TCH", "INT", "ARG", "PTH", "ERA", "RET", "FLY", "LOG", "PERF", "NPY", "RSE", "ASYNC", "DTZ", "EXE", "ISC", "ICN", "PLW", "QMD", "TID", "RUF", "AIR"]
ignore = ["E501", "B008", "SIM102", "SIM117", "T201", "T203", "PLW0603", "PLW0604", "RUF012"]
per-file-ignores = ["__init__.py:F401", "tests/*:S101", "tests/*:PLW0603", "tests/*:PLW0604"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "eval: Evaluation tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__pycache__/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"